<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Armoured Battle Console - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #17212b,
                    #080b0f 65%
                );

            color: #e6edf3;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-container {
            width: 420px;
            max-width: 92%;

            background: #111820;

            border: 1px solid #2b3743;

            border-radius: 12px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            letter-spacing: 2px;

            color: #58a6ff;
        }

        .subtitle {
            text-align: center;

            margin-top: 8px;
            margin-bottom: 30px;

            color: #8b949e;

            font-size: 14px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #c9d1d9;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            background: #0b1117;

            color: #ffffff;

            border: 1px solid #303b47;

            border-radius: 6px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #1f6feb;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            background: #2a1717;

            border: 1px solid #8b3a3a;

            color: #ffb4b4;

            padding: 11px;

            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #6e7681;

            font-size: 12px;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="logo">
        ARMOUR
    </div>

    <div class="subtitle">
        Armoured Battle Console
    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            LOGIN
        </button>

    </form>


    <div class="footer">
        Authorized Force Player Access
    </div>

</div>

</body>

</html>
