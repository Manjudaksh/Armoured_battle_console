<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Pending</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0f14;
            color: #e6edf3;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            max-width: 90%;

            background: #111820;

            border: 1px solid #303b47;
            border-radius: 12px;

            padding: 35px;

            text-align: center;
        }

        h1 {
            color: #58a6ff;
        }

        p {
            color: #8b949e;
            line-height: 1.6;
        }

        .logout {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 20px;

            background: #303b47;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Access Pending</h1>

    <p>
        Your account is active, but you have not yet
        been assigned to an operational force.
    </p>

    <p>
        Contact the system administrator to receive
        a Force Player assignment.
    </p>

    <a
        class="logout"
        href="{% url 'player_logout' %}"
    >
        Logout
    </a>

</div>

</body>

</html>
