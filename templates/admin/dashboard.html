{% extends "base.html" %}
{% load static %}

{% block title %}
Armoured Battle Console
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'cesium/Widgets/widgets.css' %}">

<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    #cesiumContainer {
        width: 100%;
        height: 100vh;
    }
</style>
{% endblock %}

{% block content %}
<div id="cesiumContainer"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'cesium/Cesium.js' %}"></script>

<script>
    Cesium.Ion.defaultAccessToken = "{{ cesium_ion_token }}";

    async function initCesium() {
        try {
            const container = document.getElementById("cesiumContainer");
            if (!container) {
                throw new Error("cesiumContainer was not found in the DOM.");
            }

            const terrainProvider = await Cesium.createWorldTerrainAsync();

            const viewer = new Cesium.Viewer(container, {
    animation: false,
    timeline: false,
    baseLayerPicker: false,   // avoids conflicting imagery layers
    geocoder: true,
    homeButton: true,
    sceneModePicker: false,   // 3D tiles only work in 3D mode
    globe: false              // Google tiles include their own ground
});

// Realistic 3D buildings (replaces OSM Buildings)
const tileset = await Cesium.createGooglePhotorealistic3DTileset();
viewer.scene.primitives.add(tileset);

viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(-74.0060, 40.7128, 600),
    orientation: {
        heading: Cesium.Math.toRadians(20),
        pitch: Cesium.Math.toRadians(-30),  // tilt matters a lot
        roll: 0
    },
    duration: 3
});

            console.log("Cesium initialized successfully.");
        } catch (error) {
            console.error("Cesium initialization failed:", error);
        }
    }

    initCesium();
</script>
{% endblock %}
